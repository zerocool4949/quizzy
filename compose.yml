services:
  quizzy:
    image: ghcr.io/zerocool4949/quizzy:latest
    # build: .  # Uncomment to build locally instead
    container_name: quizzy
    restart: unless-stopped
    ports:
      - "7111:7111"
    environment:
      - NODE_ENV=production
      - PORT=7111
      - CLIENT_URL=${CLIENT_URL:-http://localhost:7111}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - ADMIN_KEY=${ADMIN_KEY}
      - ADMIN_IPS=${ADMIN_IPS:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
    volumes:
      # Imported playlists persist across rebuilds (install-specific)
      - ./server/imported-playlists.json:/app/server/imported-playlists.json
      # Movie list (edit via admin page or without rebuild)
      - ./server/movies.json:/app/server/movies.json
      # Video game list (edit via admin page or without rebuild)
      - ./server/videogames.json:/app/server/videogames.json
      # Game logs
      - ./server/logs:/app/server/logs
      # Artist cache
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7111/api/categories"]
      interval: 30s
      timeout: 10s
      retries: 3
